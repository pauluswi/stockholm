server.port=8084
spring.application.name=settlement-service
spring.kafka.bootstrap-servers=localhost:9092
management.endpoints.web.exposure.include=health,info,metrics

# Kafka topic helper pattern for settlement service
stockholm.kafka.create-topics=true
stockholm.kafka.topics.payment-initiated=payment.initiated
stockholm.kafka.topics.settlement-completed=settlement.completed
stockholm.kafka.topics.settlement-failed=settlement.failed

spring.kafka.consumer.group-id=settlement-service-group
spring.kafka.consumer.auto-offset-reset=earliest

logging.level.com.europe.sepa.settlement=DEBUG

