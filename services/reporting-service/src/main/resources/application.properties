server.port=8086
spring.application.name=reporting-service

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.admin.fail-fast=false

# Kafka topic names
stockholm.kafka.topics.ledger-updated=ledger.updated
stockholm.kafka.topics.partitions=1
stockholm.kafka.topics.replication-factor=1
stockholm.kafka.create-topics=true

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/stockholm
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

management.endpoints.web.exposure.include=health,info,metrics

