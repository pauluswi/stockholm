spring.kafka.bootstrap-servers=${spring.embedded.kafka.brokers}
spring.kafka.admin.fail-fast=false
spring.kafka.admin.auto-create-topics=false

stockholm.kafka.create-topics=false
stockholm.kafka.topics.settlement-completed=settlement.completed
stockholm.kafka.topics.ledger-updated=ledger.updated
stockholm.kafka.topics.ledger-failed=ledger.failed

# In-memory database for integration tests
spring.datasource.url=jdbc:h2:mem:ledger_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

